{{define "content"}}
<h1>再訪</h1>

<form action="/reply" method="post">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label>あなたのコード</label>
<input type="text" name="code" autocomplete="off" required>
<p><button type="submit">確認</button></p>
</form>

{{with .Data}}
  {{if eq .Status "no-match"}}
    <div class="warn">コードが一致しません。</div>
  {{else if eq .Status "verified"}}
    <div class="warn">コードを確認しました。受信者からの返信はまだありません。</div>
  {{else if eq .Status "has-reply"}}
    <h2>受信者からの返信:</h2>
    <div class="code-box">{{.ReplyText}}</div>
  {{end}}
{{end}}
{{end}}
